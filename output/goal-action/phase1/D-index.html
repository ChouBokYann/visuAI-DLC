<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saturday workshops</title>
<style>
body{font:16px system-ui;margin:32px auto;padding:0 20px;max-width:960px;background:#f7f6f0;color:#243b32}h1{font-size:36px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}article{padding:20px;border:1px solid #cbd5c9;border-radius:8px;background:#fff}a{color:#295741}button,input{font:inherit;padding:6px}h2{font-size:20px}form{display:flex;flex-wrap:wrap;align-items:end;gap:16px;padding:16px 0}label{display:block}input[type=text]{max-width:100%;box-sizing:border-box}a:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid #8b4d00;outline-offset:3px}
</style>
<h1>Find your Saturday workshop</h1>
<p>Choose an attendable workshop by your subject interest, then contact its organiser. These are individual alternatives, not a combined itinerary. Contacting does not book a place or guarantee future availability.</p>
<form>
<label>Available from <input type="time" name="start" required></label>
<label>Available until <input type="time" name="end" required></label>
<label>Completed prerequisite IDs (comma separated) <input type="text" name="completed"></label>
<label><input type="checkbox" name="stepFreeRequired"> Require step-free access</label>
<button type="submit">Update choices</button>
</form>
<p id="preference-error" role="alert"></p>
<p id="preference-summary" aria-live="polite">Loading preferences…</p>
<main></main>
<script type="module" src="app.mjs"></script>
</html>
