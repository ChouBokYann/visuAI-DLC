<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study spaces</title><style>body{font:16px/1.5 system-ui;margin:24px auto;padding:16px;max-width:1000px;color:#24382e;background:#faf8f1}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:16px}article,#detail{background:white;border:1px solid #ccd4ca;padding:18px;overflow-wrap:anywhere}h2{font-size:1.25rem;margin-top:0}button,a{font:inherit}button{padding:10px 14px;background:#24382e;color:white;border:0;border-radius:4px;cursor:pointer}button:focus-visible,a:focus-visible,#detail:focus{outline:3px solid #8b641e;outline-offset:4px}.status{font-weight:700}article[data-state=suitable]{border-top:4px solid #42664c}article[data-state=needs-confirmation]{border-top:4px solid #8b641e}article[data-state=unsuitable]{border-top:4px solid #8d5147}#detail{margin-top:24px}a{color:#234f79}</style><h1>Find a study space</h1><p id="preference-summary"></p><main aria-label="Study space comparison"></main><section id="detail" data-id="" tabindex="-1" aria-label="Selected place" aria-live="polite">Choose a place to see details and contact information.</section><script type="module" src="app.mjs"></script></html>
