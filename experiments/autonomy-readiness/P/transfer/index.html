<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study spaces</title>
<style>
*{box-sizing:border-box}body{font:16px/1.5 system-ui;margin:24px auto;padding:16px;max-width:1080px;color:#24382e;background:#faf8f1}h1{font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.15}h2{font-size:1.25rem;margin:0 0 12px}header{margin-bottom:28px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}article,#detail{background:white;border:1px solid #aebbb1;border-radius:8px;padding:20px}article{display:flex;flex-direction:column}article p{margin:0 0 16px}.status{font-weight:650;font-size:.9rem}article[data-state=suitable]{border-top:5px solid #32734a}article[data-state=needs-confirmation]{border-top:5px solid #98651b}article[data-state=unsuitable]{border-top:5px solid #8c4242}button,a{font:inherit}button{padding:11px 14px;border:1px solid #3f634b;background:#fff;border-radius:4px;color:#24382e;cursor:pointer;margin-top:auto;text-align:left}button[aria-pressed=true]{background:#24382e;color:white}button:hover{background:#e5eee5}button[aria-pressed=true]:hover{background:#365541}a{color:#195c37;display:inline-block;padding:10px 0}button:focus-visible,a:focus-visible,#detail:focus{outline:3px solid #95701c;outline-offset:4px}#detail{margin-top:28px;scroll-margin:20px}#detail p:last-child{font-size:.88rem;color:#526058}li{margin-bottom:8px}@media(max-width:480px){body{margin:0 auto;padding:16px}article,#detail{padding:16px}}
</style></head>
<body><header><p>STUDY SPACE FINDER</p><h1>A place for your visit</h1><p id="preference-summary"></p><p>Compare the catalogue below. Unknown details need confirmation.</p></header><main aria-label="Study space options"></main><section id="detail" tabindex="-1" aria-label="Selected place"><h2>Choose a place</h2><p>Select a card to see its explanation and organiser contact.</p></section><script type="module" src="app.mjs"></script></body></html>
